name: Upload JAR to Modrinth

on:
  push:
    branches:
      - master

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find and upload JAR to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          BEFORE_COMMIT: ${{ github.event.before }}
          AFTER_COMMIT: ${{ github.event.after }}
        run: |
          # Get current version
          VERSION=$(./gradlew -q printVersion)
          # Create changelog
          CHANGELOG=$(git log --pretty=format:'%s' $BEFORE_COMMIT..$AFTER_COMMIT)
          
          if ! command -v jq &> /dev/null; then
            echo "jq not found!"
            exit 1
          fi

          # Find the JAR file in build/libs/
          JAR_PATH=$(find build/libs -type f -name "VelocityVersionBouncer-$VERSION.jar" | head -n 1)

          if [ ! -f "$JAR_PATH" ]; then
            echo "Error: No JAR file found in build/libs/"
            exit 1
          fi

          echo "Found JAR: $JAR_PATH"
          
          # determine release type
          if [[ "$VERSION" == *"release"* ]]; then
            VERSION_TYPE="release"
          else
            VERSION_TYPE="beta"
          fi
          
          # Create JSON payload safely with jq
          JSON_PAYLOAD=$(jq -n \
            --arg name "VelocityVersionBouncer $VERSION" \
            --arg version_number "$VERSION" \
            --arg version_type "$VERSION_TYPE" \
            --argjson loaders '["velocity"]' \
            --argjson game_versions '["1.12","1.12.1","1.12.2","1.13","1.13.1","1.13.2","1.14","1.14.1","1.14.2","1.14.3","1.14.4","1.15","1.15.1","1.15.2","1.16","1.16.1","1.16.2","1.16.3","1.16.4","1.16.5","1.17","1.17.1","1.18","1.18.1","1.18.2","1.19","1.19.1","1.19.2","1.19.3","1.19.4","1.20","1.20.1","1.20.2","1.20.3","1.20.4","1.20.5","1.20.6","1.21","1.21.1","1.21.2","1.21.3","1.21.4","1.21.5","1.21.6","1.21.7","1.21.8","1.21.9","1.21.10","1.21.11"]' \
            --arg changelog "$CHANGELOG" \
            --arg project_id "X5ETMik1" \
            --argjson dependencies '[]' \
            --argjson featured false \
            '{
              name: $name,
              version_number: $version_number,
              version_type: $version_type,
              loaders: $loaders,
              game_versions: $game_versions,
              project_id: $project_id,
              changelog: $changelog,
              file_parts: ["file"],
              primary_file: "file",
              dependencies: $dependencies,
              featured: $featured
            }')
          
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{response_code}" -X GET https://api.modrinth.com/v2/project/X5ETMik1/version/$VERSION -H "Authorization: Bearer $MODRINTH_TOKEN")
          if [ "$RESPONSE_CODE" == "404" ]; then
            # Upload new project version
                      curl -X POST https://api.modrinth.com/v2/version \
                        -H "Authorization: Bearer $MODRINTH_TOKEN" \
                        -F "data=$JSON_PAYLOAD;type=application/json" \
                        -F "file=@$JAR_PATH"
          else
            echo "Version already exists on Modrinth, skipping upload"
          fi
      - name: Update the projects description (body)
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          json_body=$(jq -Rs '{body: .}' < README.md)
          
          # Update project description
          curl -X PATCH https://api.modrinth.com/v2/project/X5ETMik1 \
            -H "Authorization: Bearer $MODRINTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$json_body"