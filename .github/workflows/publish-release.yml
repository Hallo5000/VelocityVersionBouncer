on:
  release:
    types: [ published ]

jobs:
  collect-resources:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      type: ${{ steps.type.outputs.type }}
    steps:
      - name: Get tag of release
        id: tag
        run: echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
      - name: Get changelog of release
        id: changelog
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          {
            echo 'changelog<<UNIQUE_DELIMITER'
            printf '%s\n' "$RELEASE_BODY"
            echo 'UNIQUE_DELIMITER'
          } >> "$GITHUB_OUTPUT"
      - name: Release of Snapshot?
        id: type
        run: |
          if [ "${{ github.event.release.prerelease }}" == "true" ]; then 
            echo "type=SNAPSHOT" >> "$GITHUB_OUTPUT"
          else 
            echo "type=release" >> "$GITHUB_OUTPUT"
          fi
      - name: Get binaries of release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TYPE: ${{ steps.type.outputs.type }}
        run: gh release download "${TAG}" -p "VelocityVersionBouncer-${TAG#v}-${TYPE}.jar"
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: "*.jar"
  publish-to-hangar:
    needs: collect-resources
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v5
        with:
          name: release-binaries
      - name: Upload the jar to hangar
        env:
          HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
          TAG: ${{ needs.collect-resources.outputs.tag }}
          TYPE: ${{ needs.collect-resources.outputs.type }}
          CHANGELOG: ${{ needs.collect-resources.outputs.changelog }}
        run: |
          # Get the full version name
          VERSION="${TAG#v}-${TYPE}"

          # Get the JAR file
          JAR_PATH="${GITHUB_WORKSPACE}/VelocityVersionBouncer-$VERSION.jar"

          # Check if the Jar actually exists
          if [ ! -f "$JAR_PATH" ]; then
            echo "Error: No JAR file found"
            exit 1
          fi
          echo "Found JAR: $JAR_PATH"

          # determine release type
          if [[ "$TYPE" == "release" ]]; then
            CHANNEL="Release"
          else
            CHANNEL="Snapshot"
          fi

          # Create JSON payload safely with jq
          JSON_PAYLOAD=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg description "$CHANGELOG" \
            --arg version "$VERSION" \
              '{
                channel: $channel,
                description: $description,
                files: [
                  {
                    platforms: ["4.2.1"]
                  }
                ],
                pluginDependencies: {},
                platformDependencies: {
                  VELOCITY: ["4.2.1"]
                },
                version: $version
              }')

          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{response_code}" -X GET "https://hangar.papermc.io/api/v1/projects/VelocityVersionBouncer/versions/$VERSION" -H 'accept: application/json')
          if [ "$RESPONSE_CODE" == "404" ]; then
            # Upload new project version
            curl -X POST https://hangar.papermc.io/api/v1/projects/VelocityVersionBouncer/upload \
              -H 'accept: application/json' \
              -H "Authorization: Bearer $HANGAR_TOKEN" \
              -F "data=$JSON_PAYLOAD;type=application/json" \
              -F "files=@$JAR_PATH"
          else
            echo "Version already exists on Hangar, skipping upload"
          fi
  publish-to-modrinth:
    needs: collect-resources
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v5
        with:
          name: release-binaries
      - name: Upload the jar to modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          TAG: ${{ needs.collect-resources.outputs.tag }}
          TYPE: ${{ needs.collect-resources.outputs.type }}
          CHANGELOG: ${{ needs.collect-resources.outputs.changelog }}
        run: |
          # Get the full version name
          VERSION="${TAG#v}-${TYPE}"

          # Get the JAR file
          JAR_PATH="${GITHUB_WORKSPACE}/VelocityVersionBouncer-$VERSION.jar"

          # Check if the Jar actually exists
          if [ ! -f "$JAR_PATH" ]; then
            echo "Error: No JAR file found"
            exit 1
          fi
          echo "Found JAR: $JAR_PATH"

          # determine release type
          if [[ "$TYPE" == "release" ]]; then
            VERSION_TYPE="release"
          else
            VERSION_TYPE="beta"
          fi

          # Create JSON payload safely with jq
          JSON_PAYLOAD=$(jq -n \
            --arg name "VelocityVersionBouncer $VERSION" \
            --arg version_number "$VERSION" \
            --arg version_type "$VERSION_TYPE" \
            --argjson loaders '["velocity"]' \
            --argjson game_versions '["1.12","1.12.1","1.12.2","1.13","1.13.1","1.13.2","1.14","1.14.1","1.14.2","1.14.3","1.14.4","1.15","1.15.1","1.15.2","1.16","1.16.1","1.16.2","1.16.3","1.16.4","1.16.5","1.17","1.17.1","1.18","1.18.1","1.18.2","1.19","1.19.1","1.19.2","1.19.3","1.19.4","1.20","1.20.1","1.20.2","1.20.3","1.20.4","1.20.5","1.20.6","1.21","1.21.1","1.21.2","1.21.3","1.21.4","1.21.5","1.21.6","1.21.7","1.21.8","1.21.9","1.21.10","1.21.11", "26.1", "26.1.1", "26.1.2", "26.2", "26.3"]' \
            --arg changelog "$CHANGELOG" \
            --arg project_id "X5ETMik1" \
            --argjson dependencies '[]' \
            --argjson featured false \
              '{
                name: $name,
                version_number: $version_number,
                version_type: $version_type,
                loaders: $loaders,
                game_versions: $game_versions,
                project_id: $project_id,
                changelog: $changelog,
                file_parts: ["file"],
                primary_file: "file",
                dependencies: $dependencies,
                featured: $featured
              }')

          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{response_code}" -X GET https://api.modrinth.com/v2/project/X5ETMik1/version/$VERSION -H "Authorization: Bearer $MODRINTH_TOKEN")
          if [ "$RESPONSE_CODE" == "404" ]; then
            # Upload new project version
            curl -X POST https://api.modrinth.com/v2/version \
              -H "Authorization: Bearer $MODRINTH_TOKEN" \
              -F "data=$JSON_PAYLOAD;type=application/json" \
              -F "file=@$JAR_PATH"
          else
            echo "Version already exists on Modrinth, skipping upload"
          fi