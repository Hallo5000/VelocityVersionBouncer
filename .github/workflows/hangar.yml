name: Publish to Hangar
on:
  push:
    branches:
      - master

jobs:
  publish:
    if: github.repository_owner == 'Hallo5000'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v1
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Create Changelog
        env:
          BEFORE_COMMIT: ${{ github.event.before }}
          AFTER_COMMIT: ${{ github.event.after }}
        run: echo "CHANGELOG=$(git log --pretty=format:'%s' $BEFORE_COMMIT..$AFTER_COMMIT)" >> $GITHUB_ENV
      - name: Publish
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: ./gradlew build publishPluginPublicationToHangar syncAllPagesToHangar --stacktrace